<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>闲鱼注册审批</title>
<style>body{font:16px system-ui;background:#f3f6fb;color:#182337;margin:40px auto;max-width:1050px;padding:20px}section{background:white;padding:25px;border-radius:16px;margin:20px 0}input,button{font:inherit;padding:10px;margin:5px;border:1px solid #cbd5e1;border-radius:8px}button{cursor:pointer;background:#2563eb;color:white}td,th{text-align:left;padding:14px;border-bottom:1px solid #eee}table{width:100%}#message{color:#b45309}</style>
<h1>闲鱼注册审批</h1><p>在任意电脑审核闲鱼平台注册申请。与采集平台的用户数据独立存储。</p>
<section id="login"><input id="username" placeholder="管理员账号" autocomplete="username"><input id="password" type="password" placeholder="管理员密码" autocomplete="current-password"><button id="signin">登录</button></section>
<p id="message" role="status"></p><section id="panel" hidden><button id="reload">刷新申请</button><button id="logout">退出</button><table><thead><tr><th>用户名</th><th>姓名</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></section>
<script>
let token='';const el=id=>document.getElementById(id);const labels={pending:'待审核',approved:'已通过',rejected:'已拒绝',disabled:'已停用'};
async function api(action,body={}){const r=await fetch('/api/xianyu/auth/'+action,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'请求失败');return d}
async function refresh(){try{const d=await api('list_users');el('rows').replaceChildren();for(const u of d.items){const tr=document.createElement('tr');for(const text of [u.username,u.employee_name,labels[u.status]||u.status]){const td=document.createElement('td');td.textContent=text;tr.append(td)}const td=document.createElement('td');if(u.role!=='admin'){for(const [a,title] of [['approve_user','通过'],['reject_user','拒绝'],['disable_user','停用']]){const b=document.createElement('button');b.textContent=title;b.onclick=async()=>{if(!confirm(title+' '+u.username+'？'))return;try{await api(a,{user_id:u.id});await refresh()}catch(e){el('message').textContent=e.message}};td.append(b)}}tr.append(td);el('rows').append(tr)}el('message').textContent='共 '+d.items.filter(u=>u.status==='pending').length+' 条待审核申请'}catch(e){el('message').textContent=e.message}}
el('signin').onclick=async()=>{try{const d=await api('login',{username:el('username').value,password:el('password').value});if(d.user.role!=='admin')throw Error('仅管理员可进入审批页面');token=d.session_token;el('password').value='';el('login').hidden=true;el('panel').hidden=false;await refresh()}catch(e){el('message').textContent=e.message}};
el('reload').onclick=refresh;el('logout').onclick=async()=>{try{await api('logout')}finally{token='';el('panel').hidden=true;el('rows').replaceChildren();el('login').hidden=false}};setInterval(()=>{if(token)refresh()},15000);
</script></html>
