services:
  mysql:
    image: mysql:8.0
    container_name: ${XR_CONTAINER_PREFIX:-xr}-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xianyu_rewrite}
      MYSQL_USER: ${MYSQL_USER:-xianyu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-mysql-password}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4","--collation-server=utf8mb4_unicode_ci","--max-connections=300","--max-allowed-packet=256M","--default-time-zone=+08:00"]
    volumes: [mysql_data:/var/lib/mysql]
    networks: [xr-net]
    healthcheck: {test: ["CMD","mysqladmin","ping","-h","localhost","-u","root","-p${MYSQL_ROOT_PASSWORD:-change-me-root-password}"], interval: 10s, timeout: 5s, retries: 10, start_period: 30s}

  redis:
    image: redis:7-alpine
    container_name: ${XR_CONTAINER_PREFIX:-xr}-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me-redis-password}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    environment: [TZ=Asia/Shanghai]
    volumes: [redis_data:/data]
    networks: [xr-net]
    healthcheck: {test: ["CMD","redis-cli","-a","${REDIS_PASSWORD:-change-me-redis-password}","ping"], interval: 10s, timeout: 5s, retries: 5, start_period: 10s}

  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    image: ${XR_IMAGE_REGISTRY:-local}/${XR_IMAGE_NAMESPACE:-xianyu}/xianyu-backend:${XR_IMAGE_TAG:-local}
    container_name: ${XR_CONTAINER_PREFIX:-xr}-backend
    restart: unless-stopped
    working_dir: /app
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8089"]
    environment:
      ENVIRONMENT: production
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-xianyu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-mysql-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xianyu_rewrite}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis-password}
      REDIS_DB: 0
      BACKEND_WEB_PORT: 8089
      HOST: 0.0.0.0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:20000,http://localhost:20000}
      CARD_DOCK_BASE_URL: ${CARD_DOCK_BASE_URL:-}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY:-}
      WEBSOCKET_SERVICE_URL: http://websocket:8090
      SCHEDULER_SERVICE_URL: http://scheduler:8091
      UPDATE_MANIFEST_URL: ${UPDATE_MANIFEST_URL:-https://www.gemstory.cn/release/xianyu/latest.json}
      STATIC_DIR: /app/static
      BACKUP_DIR: /app/backups
      XIANYU_CLOUD_AUTH_URL: ${XIANYU_CLOUD_AUTH_URL:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      TZ: Asia/Shanghai
    volumes: [static-files:/app/static, backup-files:/app/backups]
    ports: ["127.0.0.1:${BACKEND_WEB_PORT:-8089}:8089"]
    networks: [xr-net]
    extra_hosts:
      - "www.gemstory.cn:${XIANYU_CLOUD_AUTH_HOST_IP:-49.232.128.118}"
    depends_on: {mysql: {condition: service_healthy}, redis: {condition: service_healthy}}
    healthcheck: {test: ["CMD","curl","-f","http://localhost:8089/health"], interval: 30s, timeout: 10s, retries: 3, start_period: 60s}

  websocket:
    build: {context: ., dockerfile: websocket/Dockerfile}
    image: ${XR_IMAGE_REGISTRY:-local}/${XR_IMAGE_NAMESPACE:-xianyu}/xianyu-websocket:${XR_IMAGE_TAG:-local}
    container_name: ${XR_CONTAINER_PREFIX:-xr}-websocket
    restart: unless-stopped
    working_dir: /app
    command: ["uvicorn", "websocket.main:app", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      ENVIRONMENT: production
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-xianyu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-mysql-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xianyu_rewrite}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis-password}
      REDIS_DB: 0
      WEBSOCKET_PORT: 8090
      HOST: 0.0.0.0
      BACKEND_SERVICE_URL: http://backend:8089
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      STATIC_DIR: /app/static
      BROWSER_DATA_DIR: /app/browser_data
      BROWSER_HEADLESS: "true"
      TZ: Asia/Shanghai
    volumes: [static-files:/app/static, browser_data:/app/browser_data]
    ports: ["127.0.0.1:${WEBSOCKET_PORT:-8090}:8090"]
    networks: [xr-net]
    depends_on: {mysql: {condition: service_healthy}, redis: {condition: service_healthy}, backend: {condition: service_healthy}}
    healthcheck: {test: ["CMD","curl","-f","http://localhost:8090/health"], interval: 30s, timeout: 10s, retries: 3, start_period: 60s}

  scheduler:
    build: {context: ., dockerfile: scheduler/Dockerfile}
    image: ${XR_IMAGE_REGISTRY:-local}/${XR_IMAGE_NAMESPACE:-xianyu}/xianyu-scheduler:${XR_IMAGE_TAG:-local}
    container_name: ${XR_CONTAINER_PREFIX:-xr}-scheduler
    restart: unless-stopped
    working_dir: /app
    command: ["uvicorn", "scheduler.main:app", "--host", "0.0.0.0", "--port", "8091"]
    environment:
      ENVIRONMENT: production
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-xianyu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-mysql-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xianyu_rewrite}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis-password}
      REDIS_DB: 0
      SCHEDULER_PORT: 8091
      HOST: 0.0.0.0
      BACKEND_SERVICE_URL: http://backend:8089
      WEBSOCKET_SERVICE_URL: http://websocket:8090
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      STATIC_DIR: /app/static
      BACKUP_DIR: /app/backups
      TZ: Asia/Shanghai
    volumes: [static-files:/app/static, backup-files:/app/backups]
    ports: ["127.0.0.1:${SCHEDULER_PORT:-8091}:8091"]
    networks: [xr-net]
    depends_on: {mysql: {condition: service_healthy}, redis: {condition: service_healthy}, backend: {condition: service_healthy}, websocket: {condition: service_healthy}}
    healthcheck: {test: ["CMD","curl","-f","http://localhost:8091/health"], interval: 30s, timeout: 10s, retries: 3, start_period: 60s}

  frontend:
    build: {context: ., dockerfile: deploy/frontend.Dockerfile}
    image: ${XR_IMAGE_REGISTRY:-local}/${XR_IMAGE_NAMESPACE:-xianyu}/xianyu-frontend:${XR_IMAGE_TAG:-local}
    container_name: ${XR_CONTAINER_PREFIX:-xr}-frontend
    restart: unless-stopped
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    ports: ["${FRONTEND_PORT:-9000}:80"]
    networks: [xr-net]
    depends_on: {backend: {condition: service_healthy}}

networks:
  xr-net:
    name: ${XR_NETWORK_NAME:-xr-net}
    driver: bridge
volumes:
  mysql_data:
    name: ${XR_VOLUME_PREFIX:-xr}_mysql_data
  redis_data:
    name: ${XR_VOLUME_PREFIX:-xr}_redis_data
  static-files:
    name: ${XR_VOLUME_PREFIX:-xr}_static_files
  backup-files:
    name: ${XR_VOLUME_PREFIX:-xr}_backup_files
  browser_data:
    name: ${XR_VOLUME_PREFIX:-xr}_browser_data
