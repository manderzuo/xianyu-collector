name: Build and publish Xianyu images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v'
        required: true
        type: string
      notes:
        description: 'Release notes'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: xianyu-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}
  CLIENT_IMAGE_REGISTRY: www.gemstory.cn
  CLIENT_IMAGE_NAMESPACE: xianyu

jobs:
  registry_bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload incremental registry installer
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TENCENT_UPDATE_SSH_HOST }}
          username: ${{ secrets.TENCENT_UPDATE_SSH_USER }}
          key: ${{ secrets.TENCENT_UPDATE_SSH_KEY }}
          source: deploy/registry/*
          target: /tmp/xianyu-registry-bootstrap-${{ github.run_id }}
          strip_components: 2
          command_timeout: 5m

      - name: Ensure incremental registry is available
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TENCENT_UPDATE_SSH_HOST }}
          username: ${{ secrets.TENCENT_UPDATE_SSH_USER }}
          key: ${{ secrets.TENCENT_UPDATE_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            deploy_dir="/tmp/xianyu-registry-bootstrap-${{ github.run_id }}"
            status=0
            sudo python3 "${deploy_dir}/install.py" || status=$?
            sudo rm -rf "${deploy_dir}"
            exit "${status}"

  release_base:
    needs: registry_bootstrap
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.base.outputs.version }}
      image_prefix: ${{ steps.base.outputs.image_prefix }}
      build_version: ${{ steps.base.outputs.build_version }}
      images_changed: ${{ steps.base.outputs.images_changed }}
      runtime_registry: ${{ steps.base.outputs.runtime_registry }}
      runtime_namespace: ${{ steps.base.outputs.runtime_namespace }}
      runtime_tag: ${{ steps.base.outputs.runtime_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve latest stable image as the incremental base
        id: base
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target_version="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            target_version="${GITHUB_REF_NAME#v}"
          else
            target_version="$(tr -d '\r\n' < VERSION.txt)"
          fi
          images_changed=true
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ]; then
            if git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null && \
               git diff --quiet "${{ github.event.before }}" "${GITHUB_SHA}" -- \
                 backend/Dockerfile backend/requirements.txt \
                 websocket/Dockerfile websocket/requirements.txt \
                 scheduler/Dockerfile scheduler/requirements.txt \
                 deploy/frontend.Dockerfile deploy/incremental .dockerignore; then
              images_changed=false
            fi
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            https://www.gemstory.cn/release/xianyu/latest.json -o latest-stable.json
          base_version="$(jq -r '.version // empty' latest-stable.json)"
          runtime_registry="$(jq -r '.image_registry // empty' latest-stable.json)"
          runtime_namespace="$(jq -r '.image_namespace // empty' latest-stable.json)"
          runtime_tag="$(jq -r '.image_tag // empty' latest-stable.json)"
          python - "${base_version}" "${target_version}" <<'PY'
          import re
          import sys

          base, target = sys.argv[1:]
          pattern = re.compile(r"^[0-9]+(?:\.[0-9]+){1,3}$")
          if not pattern.fullmatch(base) or not pattern.fullmatch(target):
              raise SystemExit(f"invalid release chain: base={base!r}, target={target!r}")
          normalize = lambda value: tuple(int(part) for part in value.split(".")) + (0,) * (4 - len(value.split(".")))
          if normalize(target) < normalize(base):
              raise SystemExit(f"refusing release downgrade: base={base}, target={target}")
          PY
          # Client-only releases keep using the stable runtime image tag. The
          # manifest version (for example 1.1.2) is not necessarily an image
          # tag, so validate the resolved runtime tag instead.
          for service in backend websocket scheduler frontend; do
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              "https://${CLIENT_IMAGE_REGISTRY}/v2/${CLIENT_IMAGE_NAMESPACE}/xianyu-${service}/manifests/${runtime_tag}" \
              >/dev/null
          done
          # The original 1.0.10 commercial offline package flattened its
          # application images during export. Bootstrap those clients onto
          # the host-overlay updater while continuing to use their installed
          # local runtime; this avoids a one-time 780 MB replacement pull.
          if [ "${images_changed}" = "false" ] && [ "${target_version}" = "1.1.1" ]; then
            runtime_registry="local"
            runtime_namespace="xianyu"
            runtime_tag="1.0.10"
          fi
          target_probe="${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/xianyu-backend:${target_version}"
          if docker manifest inspect "${target_probe}" >/dev/null 2>&1; then
            image_prefix="${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}"
            build_version="${target_version}"
          elif [ "${base_version}" = "1.0.10" ]; then
            image_prefix="${CLIENT_IMAGE_REGISTRY}/${CLIENT_IMAGE_NAMESPACE}"
            build_version="${base_version}"
          else
            image_prefix="${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}"
            build_version="${base_version}"
          fi
          echo "version=${base_version}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=${image_prefix}" >> "$GITHUB_OUTPUT"
          echo "build_version=${build_version}" >> "$GITHUB_OUTPUT"
          echo "images_changed=${images_changed}" >> "$GITHUB_OUTPUT"
          echo "runtime_registry=${runtime_registry}" >> "$GITHUB_OUTPUT"
          echo "runtime_namespace=${runtime_namespace}" >> "$GITHUB_OUTPUT"
          echo "runtime_tag=${runtime_tag}" >> "$GITHUB_OUTPUT"
          echo "Stable base version: ${base_version}; build parent: ${image_prefix}:${build_version}; target version: ${target_version}"
          echo "Application image sources changed: ${images_changed}"

  build:
    needs: release_base
    if: needs.release_base.outputs.images_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: deploy/incremental/backend.Dockerfile
          - name: websocket
            dockerfile: deploy/incremental/websocket.Dockerfile
          - name: scheduler
            dockerfile: deploy/incremental/scheduler.Dockerfile
          - name: frontend
            dockerfile: deploy/incremental/frontend.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release values
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            version="$(python -c 'from pathlib import Path; print(Path("VERSION.txt").read_text(encoding="utf-8-sig").strip())')"
          else
            echo 'Unsupported event.' >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          build_id="${GITHUB_SHA:0:12}-${version}"
          signature_file="xianyu-${build_id}.json.sig"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "signature_file=$signature_file" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/xianyu-${{ matrix.name }}:${{ steps.release.outputs.version }}
          build-args: |
            BASE_IMAGE=${{ needs.release_base.outputs.image_prefix }}/xianyu-${{ matrix.name }}:${{ needs.release_base.outputs.build_version }}
            APP_VERSION=${{ steps.release.outputs.version }}
            APP_BUILD_ID=${{ steps.release.outputs.build_id }}

  client_package:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build client maintenance package
        id: package
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.Substring(1)
          } elseif ('${{ github.event_name }}' -eq 'push') {
            $version = (Get-Content -LiteralPath 'VERSION.txt' -Raw).TrimStart([char]0xFEFF).Trim()
          } else {
            throw 'Unsupported event.'
          }
          if ($version -notmatch '^\d+(\.\d+){1,3}$') { throw "Invalid release version: $version" }
          $buildId = "$(($env:GITHUB_SHA).Substring(0,12))-$version"
          $packageFile = "xianyu-client-$buildId.zip"
          $clientRoot = Join-Path $env:RUNNER_TEMP 'xianyu-client-package'
          Push-Location frontend
          try {
            npm ci --no-audit --no-fund
            $env:APP_VERSION = $version
            npm run build
          } finally {
            Pop-Location
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\tools\build-windows-installer.ps1' -OutputDirectory $clientRoot -VersionOverride $version -BuildIdOverride $buildId -Force
          New-Item -ItemType Directory -Path (Join-Path $PWD 'release') -Force | Out-Null
          Compress-Archive -Path (Join-Path $clientRoot '*') -DestinationPath (Join-Path $PWD "release\$packageFile") -CompressionLevel Optimal -Force
          "package_file=$packageFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload client maintenance package artifact
        uses: actions/upload-artifact@v4
        with:
          name: xianyu-client-package
          path: release/*.zip
          if-no-files-found: error

  manifest:
    needs: [registry_bootstrap, release_base, build, client_package]
    if: >-
      always() &&
      needs.registry_bootstrap.result == 'success' &&
      needs.release_base.result == 'success' &&
      needs.client_package.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release values
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            notes="${{ inputs.notes }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            notes=""
          elif [ "${{ github.event_name }}" = "push" ]; then
            version="$(python -c 'from pathlib import Path; print(Path("VERSION.txt").read_text(encoding="utf-8-sig").strip())')"
            notes="Automatic build from ${GITHUB_SHA:0:12}"
          else
            echo 'Unsupported event.' >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          build_id="${GITHUB_SHA:0:12}-${version}"
          signature_file="xianyu-${build_id}.json.sig"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "signature_file=$signature_file" >> "$GITHUB_OUTPUT"
          package_file="xianyu-client-${build_id}.zip"
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"
          printf '%s' "$notes" > release-notes.txt

      - name: Download client maintenance package
        uses: actions/download-artifact@v4
        with:
          name: xianyu-client-package
          path: release/client-download

      - name: Place client maintenance package
        shell: bash
        run: cp release/client-download/*.zip release/

      - name: Create legacy client bootstrap marker
        if: needs.release_base.outputs.images_changed == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          marker_ref="local/xianyu/xianyu-update-marker:${{ steps.release.outputs.build_id }}"
          marker_file="xianyu-update-marker-${{ steps.release.outputs.build_id }}.tar.gz"
          mkdir -p release/marker-root
          printf '%s\n' '${{ steps.release.outputs.build_id }}' > release/marker-root/build-id.txt
          tar -C release/marker-root -cf release/marker-rootfs.tar .
          docker import release/marker-rootfs.tar "${marker_ref}" >/dev/null
          docker save "${marker_ref}" | gzip -1 > "release/${marker_file}"
          marker_sha="$(sha256sum "release/${marker_file}" | awk '{print $1}')"
          jq -n \
            --arg service 'client-bootstrap' \
            --arg url "https://www.gemstory.cn/release/xianyu/${marker_file}" \
            --arg image_ref "${marker_ref}" \
            --arg sha256 "${marker_sha}" \
            '{artifacts: [{service: $service, url: $url, image_ref: $image_ref, sha256: $sha256}]}' \
            > release/image-artifacts.json

      - name: Upload legacy client bootstrap marker
        if: needs.release_base.outputs.images_changed == 'false'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TENCENT_UPDATE_SSH_HOST }}
          username: ${{ secrets.TENCENT_UPDATE_SSH_USER }}
          key: ${{ secrets.TENCENT_UPDATE_SSH_KEY }}
          source: release/xianyu-update-marker-*.tar.gz
          target: ${{ secrets.TENCENT_UPDATE_REMOTE_PATH }}
          strip_components: 1
          command_timeout: 5m

      - name: Promote only new layers into Tencent registry
        if: needs.release_base.outputs.images_changed == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TENCENT_UPDATE_SSH_HOST }}
          username: ${{ secrets.TENCENT_UPDATE_SSH_USER }}
          key: ${{ secrets.TENCENT_UPDATE_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -Eeuo pipefail
            version="${{ steps.release.outputs.version }}"
            base_version="${{ needs.release_base.outputs.version }}"
            for service in backend websocket scheduler frontend; do
              sudo python3 /opt/gemstory/xianyu-registry-tools/promote_incremental.py \
                --source-repository "${{ env.IMAGE_NAMESPACE }}/xianyu-${service}" \
                --source-reference "${version}" \
                --destination-repository "xianyu/xianyu-${service}" \
                --base-reference "${base_version}" \
                --target-reference "${version}"
            done

      - name: Verify incremental registry images
        if: needs.release_base.outputs.images_changed == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error https://${CLIENT_IMAGE_REGISTRY}/v2/ >/dev/null
          for service in backend websocket scheduler frontend; do
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              "https://${CLIENT_IMAGE_REGISTRY}/v2/${CLIENT_IMAGE_NAMESPACE}/xianyu-${service}/manifests/${RELEASE_VERSION}" \
              >/dev/null
          done

      - name: Verify client-only release artifact
        if: needs.release_base.outputs.images_changed == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          marker_file="xianyu-update-marker-${{ steps.release.outputs.build_id }}.tar.gz"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 -I \
            "https://${CLIENT_IMAGE_REGISTRY}/release/xianyu/${marker_file}" >/dev/null

      - name: Create update manifest
        run: |
          if [ "${{ needs.release_base.outputs.images_changed }}" = "true" ]; then
            registry="${CLIENT_IMAGE_REGISTRY}"
            namespace="${CLIENT_IMAGE_NAMESPACE}"
            tag="${{ steps.release.outputs.version }}"
            runtime_required=true
            artifact_args=()
          else
            registry="${{ needs.release_base.outputs.runtime_registry }}"
            namespace="${{ needs.release_base.outputs.runtime_namespace }}"
            tag="${{ needs.release_base.outputs.runtime_tag }}"
            runtime_required=false
            artifact_args=(--image-artifacts-json release/image-artifacts.json)
          fi
          python tools/build_xianyu_release_manifest.py \
            --version "${{ steps.release.outputs.version }}" \
            --build-id "${{ steps.release.outputs.build_id }}" \
            --registry "${registry}" \
            --namespace "${namespace}" \
            --tag "${tag}" \
            --runtime-images-required "${runtime_required}" \
            "${artifact_args[@]}" \
            --notes "$(cat release-notes.txt)" \
            --package-url "https://www.gemstory.cn/release/xianyu/${{ steps.release.outputs.package_file }}" \
            --package-sha256 "$(sha256sum "release/${{ steps.release.outputs.package_file }}" | awk '{print $1}')" \
            --output release/latest.json

      - name: Sign update manifest
        shell: bash
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          if [ -z "${UPDATE_SIGNING_PRIVATE_KEY}" ]; then
            echo 'UPDATE_SIGNING_PRIVATE_KEY repository secret is required for signed releases.' >&2
            exit 1
          fi
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s\n' "${UPDATE_SIGNING_PRIVATE_KEY}" > "${key_file}"
          signature_file="release/${{ steps.release.outputs.signature_file }}"
          compatibility_signature="release/latest.json.sig"
          openssl dgst -sha256 -sign "${key_file}" -out "${compatibility_signature}.bin" release/latest.json
          base64 -w0 "${compatibility_signature}.bin" > "${compatibility_signature}"
          printf '\n' >> "${compatibility_signature}"
          cp "${compatibility_signature}" "${signature_file}"
          # The signature is public release metadata. Make it readable by the
          # containerized SCP action that uploads it to the update server.
          chmod 0644 "${signature_file}" "${compatibility_signature}"
          rm -f "${compatibility_signature}.bin"

      - name: Upload client maintenance package to Tencent server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TENCENT_UPDATE_SSH_HOST }}
          username: ${{ secrets.TENCENT_UPDATE_SSH_USER }}
          key: ${{ secrets.TENCENT_UPDATE_SSH_KEY }}
          source: release/${{ steps.release.outputs.package_file }}
          target: ${{ secrets.TENCENT_UPDATE_REMOTE_PATH }}
          strip_components: 1
          command_timeout: 10m

      - name: Publish manifest signatures before manifest
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TENCENT_UPDATE_SSH_HOST }}
          username: ${{ secrets.TENCENT_UPDATE_SSH_USER }}
          key: ${{ secrets.TENCENT_UPDATE_SSH_KEY }}
          source: release/*.json.sig
          target: ${{ secrets.TENCENT_UPDATE_REMOTE_PATH }}
          strip_components: 1
          command_timeout: 5m

      - name: Publish latest manifest last
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TENCENT_UPDATE_SSH_HOST }}
          username: ${{ secrets.TENCENT_UPDATE_SSH_USER }}
          key: ${{ secrets.TENCENT_UPDATE_SSH_KEY }}
          source: release/latest.json
          target: ${{ secrets.TENCENT_UPDATE_REMOTE_PATH }}
          strip_components: 1
          command_timeout: 5m

      - name: Verify Tencent release is readable
        shell: bash
        env:
          RELEASE_BASE_URL: https://www.gemstory.cn/release/xianyu
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "${RELEASE_BASE_URL}/latest.json" -o release/remote-latest.json
          jq -e '.version and .build_id and .image_registry and .image_namespace and (.runtime_images_required != null)' release/remote-latest.json >/dev/null
          # Legacy signed clients use latest.json.sig when the manifest does
          # not declare a versioned URL. This compatibility form avoids the
          # 1.0.10 PowerShell multi-output comparison bug while preserving
          # mandatory RSA signature verification.
          jq -e '.signature.url == null' release/remote-latest.json >/dev/null
          signature_url="${RELEASE_BASE_URL}/latest.json.sig"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "${signature_url}" -o release/remote-latest.json.sig
          test -s release/remote-latest.json.sig
          package_url="$(jq -r '.client.package_url // empty' release/remote-latest.json)"
          test -n "${package_url}"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 -I "${package_url}" >/dev/null
          if jq -e '.runtime_images_required == true' release/remote-latest.json >/dev/null; then
            version="$(jq -r '.version' release/remote-latest.json)"
            for service in backend websocket scheduler frontend; do
              curl --fail --silent --show-error --retry 3 --retry-delay 2 \
                -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
                "https://www.gemstory.cn/v2/xianyu/xianyu-${service}/manifests/${version}" \
                >/dev/null
            done
          else
            artifact_url="$(jq -r '.image_artifacts[0].url // empty' release/remote-latest.json)"
            test -n "${artifact_url}"
            curl --fail --silent --show-error --retry 3 --retry-delay 2 -I "${artifact_url}" >/dev/null
          fi
          echo 'Tencent release manifest and incremental registry images are reachable.'
