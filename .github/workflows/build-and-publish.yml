name: Build and publish Xianyu images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v'
        required: true
        type: string
      notes:
        description: 'Release notes'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: xianyu-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}
  CLIENT_IMAGE_REGISTRY: www.gemstory.cn
  CLIENT_IMAGE_NAMESPACE: xianyu

jobs:
  registry_bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload incremental registry installer
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TENCENT_UPDATE_SSH_HOST }}
          username: ${{ secrets.TENCENT_UPDATE_SSH_USER }}
          key: ${{ secrets.TENCENT_UPDATE_SSH_KEY }}
          source: deploy/registry/*
          target: /tmp/xianyu-registry-bootstrap-${{ github.run_id }}
          strip_components: 2
          command_timeout: 5m

      - name: Ensure incremental registry is available
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TENCENT_UPDATE_SSH_HOST }}
          username: ${{ secrets.TENCENT_UPDATE_SSH_USER }}
          key: ${{ secrets.TENCENT_UPDATE_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            deploy_dir="/tmp/xianyu-registry-bootstrap-${{ github.run_id }}"
            status=0
            sudo python3 "${deploy_dir}/install.py" || status=$?
            sudo rm -rf "${deploy_dir}"
            exit "${status}"

  build:
    needs: registry_bootstrap
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: deploy/incremental/backend.Dockerfile
          - name: websocket
            dockerfile: deploy/incremental/websocket.Dockerfile
          - name: scheduler
            dockerfile: deploy/incremental/scheduler.Dockerfile
          - name: frontend
            dockerfile: deploy/incremental/frontend.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release values
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            version="$(python -c 'from pathlib import Path; print(Path("VERSION.txt").read_text(encoding="utf-8-sig").strip())')"
          else
            echo 'Unsupported event.' >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          build_id="${GITHUB_SHA:0:12}-${version}"
          signature_file="xianyu-${build_id}.json.sig"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "signature_file=$signature_file" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/xianyu-${{ matrix.name }}:${{ steps.release.outputs.version }}
          build-args: |
            BASE_IMAGE=${{ env.CLIENT_IMAGE_REGISTRY }}/${{ env.CLIENT_IMAGE_NAMESPACE }}/xianyu-${{ matrix.name }}:1.0.10
            APP_VERSION=${{ steps.release.outputs.version }}
            APP_BUILD_ID=${{ steps.release.outputs.build_id }}

  client_package:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build client maintenance package
        id: package
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.Substring(1)
          } elseif ('${{ github.event_name }}' -eq 'push') {
            $version = (Get-Content -LiteralPath 'VERSION.txt' -Raw).TrimStart([char]0xFEFF).Trim()
          } else {
            throw 'Unsupported event.'
          }
          if ($version -notmatch '^\d+(\.\d+){1,3}$') { throw "Invalid release version: $version" }
          $buildId = "$(($env:GITHUB_SHA).Substring(0,12))-$version"
          $packageFile = "xianyu-client-$buildId.zip"
          $clientRoot = Join-Path $env:RUNNER_TEMP 'xianyu-client-package'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\tools\build-windows-installer.ps1' -OutputDirectory $clientRoot -VersionOverride $version -BuildIdOverride $buildId -Force
          New-Item -ItemType Directory -Path (Join-Path $PWD 'release') -Force | Out-Null
          Compress-Archive -Path (Join-Path $clientRoot '*') -DestinationPath (Join-Path $PWD "release\$packageFile") -CompressionLevel Optimal -Force
          "package_file=$packageFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload client maintenance package artifact
        uses: actions/upload-artifact@v4
        with:
          name: xianyu-client-package
          path: release/*.zip
          if-no-files-found: error

  manifest:
    needs: [registry_bootstrap, build, client_package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release values
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            notes="${{ inputs.notes }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            notes=""
          elif [ "${{ github.event_name }}" = "push" ]; then
            version="$(python -c 'from pathlib import Path; print(Path("VERSION.txt").read_text(encoding="utf-8-sig").strip())')"
            notes="Automatic build from ${GITHUB_SHA:0:12}"
          else
            echo 'Unsupported event.' >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          build_id="${GITHUB_SHA:0:12}-${version}"
          signature_file="xianyu-${build_id}.json.sig"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "signature_file=$signature_file" >> "$GITHUB_OUTPUT"
          package_file="xianyu-client-${build_id}.zip"
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"
          printf '%s' "$notes" > release-notes.txt

      - name: Download client maintenance package
        uses: actions/download-artifact@v4
        with:
          name: xianyu-client-package
          path: release/client-download

      - name: Place client maintenance package
        shell: bash
        run: cp release/client-download/*.zip release/

      - name: Login to GitHub Container Registry for packaging
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare registry import archives
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          mkdir -p release/registry-upload
          : > release/registry-upload/SHA256SUMS
          for service in backend websocket scheduler frontend; do
            image_ref="${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/xianyu-${service}:${RELEASE_VERSION}"
            archive="xianyu-${service}.tar.gz"
            echo "Preparing ${image_ref} for incremental registry import"
            docker pull "${image_ref}"
            docker save "${image_ref}" | gzip -1 > "release/registry-upload/${archive}"
            (cd release/registry-upload && sha256sum "${archive}" >> SHA256SUMS)
          done

      - name: Upload images for registry import
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TENCENT_UPDATE_SSH_HOST }}
          username: ${{ secrets.TENCENT_UPDATE_SSH_USER }}
          key: ${{ secrets.TENCENT_UPDATE_SSH_KEY }}
          source: release/registry-upload/*
          target: /tmp/xianyu-registry-import-${{ github.run_id }}
          strip_components: 2
          command_timeout: 30m

      - name: Import image layers into Tencent registry
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TENCENT_UPDATE_SSH_HOST }}
          username: ${{ secrets.TENCENT_UPDATE_SSH_USER }}
          key: ${{ secrets.TENCENT_UPDATE_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -Eeuo pipefail
            stage="/tmp/xianyu-registry-import-${{ github.run_id }}"
            version="${{ steps.release.outputs.version }}"
            trap 'rm -rf "${stage}"' EXIT
            cd "${stage}"
            sha256sum -c SHA256SUMS
            for service in backend websocket scheduler frontend; do
              archive="${stage}/xianyu-${service}.tar.gz"
              image_tar="${stage}/xianyu-${service}.tar"
              gzip -dc "${archive}" > "${image_tar}"
              skopeo --insecure-policy copy --dest-tls-verify=false \
                "docker-archive:${image_tar}" \
                "docker://127.0.0.1:5000/xianyu/xianyu-${service}:${version}"
              rm -f "${image_tar}"
            done

      - name: Verify incremental registry images
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error https://${CLIENT_IMAGE_REGISTRY}/v2/ >/dev/null
          for service in backend websocket scheduler frontend; do
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              "https://${CLIENT_IMAGE_REGISTRY}/v2/${CLIENT_IMAGE_NAMESPACE}/xianyu-${service}/manifests/${RELEASE_VERSION}" \
              >/dev/null
          done

      - name: Create update manifest
        run: |
          python tools/build_xianyu_release_manifest.py \
            --version "${{ steps.release.outputs.version }}" \
            --build-id "${{ steps.release.outputs.build_id }}" \
            --registry "${{ env.CLIENT_IMAGE_REGISTRY }}" \
            --namespace "${{ env.CLIENT_IMAGE_NAMESPACE }}" \
            --tag "${{ steps.release.outputs.version }}" \
            --notes "$(cat release-notes.txt)" \
            --package-url "https://www.gemstory.cn/release/xianyu/${{ steps.release.outputs.package_file }}" \
            --package-sha256 "$(sha256sum "release/${{ steps.release.outputs.package_file }}" | awk '{print $1}')" \
            --signature-url "https://www.gemstory.cn/release/xianyu/${{ steps.release.outputs.signature_file }}" \
            --signature-algorithm "RSA-SHA256" \
            --output release/latest.json

      - name: Sign update manifest
        shell: bash
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          if [ -z "${UPDATE_SIGNING_PRIVATE_KEY}" ]; then
            echo 'UPDATE_SIGNING_PRIVATE_KEY repository secret is required for signed releases.' >&2
            exit 1
          fi
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s\n' "${UPDATE_SIGNING_PRIVATE_KEY}" > "${key_file}"
          signature_file="release/${{ steps.release.outputs.signature_file }}"
          openssl dgst -sha256 -sign "${key_file}" -out "${signature_file}.bin" release/latest.json
          base64 -w0 "${signature_file}.bin" > "${signature_file}"
          printf '\n' >> "${signature_file}"
          rm -f "${signature_file}.bin"

      - name: Upload client maintenance package to Tencent server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TENCENT_UPDATE_SSH_HOST }}
          username: ${{ secrets.TENCENT_UPDATE_SSH_USER }}
          key: ${{ secrets.TENCENT_UPDATE_SSH_KEY }}
          source: release/${{ steps.release.outputs.package_file }}
          target: ${{ secrets.TENCENT_UPDATE_REMOTE_PATH }}
          strip_components: 1
          command_timeout: 10m

      - name: Publish manifest signature before manifest
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TENCENT_UPDATE_SSH_HOST }}
          username: ${{ secrets.TENCENT_UPDATE_SSH_USER }}
          key: ${{ secrets.TENCENT_UPDATE_SSH_KEY }}
          source: release/${{ steps.release.outputs.signature_file }}
          target: ${{ secrets.TENCENT_UPDATE_REMOTE_PATH }}
          strip_components: 1
          command_timeout: 5m

      - name: Publish latest manifest last
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TENCENT_UPDATE_SSH_HOST }}
          username: ${{ secrets.TENCENT_UPDATE_SSH_USER }}
          key: ${{ secrets.TENCENT_UPDATE_SSH_KEY }}
          source: release/latest.json
          target: ${{ secrets.TENCENT_UPDATE_REMOTE_PATH }}
          strip_components: 1
          command_timeout: 5m

      - name: Verify Tencent release is readable
        shell: bash
        env:
          RELEASE_BASE_URL: https://www.gemstory.cn/release/xianyu
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "${RELEASE_BASE_URL}/latest.json" -o release/remote-latest.json
          jq -e '.version and .build_id and .image_registry == "www.gemstory.cn" and .image_namespace == "xianyu" and (.image_artifacts | length == 0)' release/remote-latest.json >/dev/null
          signature_url="$(jq -r '.signature.url // empty' release/remote-latest.json)"
          test -n "${signature_url}"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "${signature_url}" -o release/remote-latest.json.sig
          test -s release/remote-latest.json.sig
          package_url="$(jq -r '.client.package_url // empty' release/remote-latest.json)"
          test -n "${package_url}"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 -I "${package_url}" >/dev/null
          version="$(jq -r '.version' release/remote-latest.json)"
          for service in backend websocket scheduler frontend; do
            curl --fail --silent --show-error --retry 3 --retry-delay 2 \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              "https://www.gemstory.cn/v2/xianyu/xianyu-${service}/manifests/${version}" \
              >/dev/null
          done
          echo 'Tencent release manifest and incremental registry images are reachable.'
