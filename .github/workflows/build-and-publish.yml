name: Build and publish Xianyu images

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v'
        required: true
        type: string
      notes:
        description: 'Release notes'
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
          - name: websocket
            dockerfile: websocket/Dockerfile
          - name: scheduler
            dockerfile: scheduler/Dockerfile
          - name: frontend
            dockerfile: deploy/frontend.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release values
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(tr -d '\r\n' < VERSION.txt)"
          fi
          if [ -z "$version" ]; then
            echo 'VERSION.txt is empty.' >&2
            exit 1
          fi
          build_id="${GITHUB_SHA:0:12}-${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/xianyu-${{ matrix.name }}:${{ steps.release.outputs.version }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release values
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            notes="${{ inputs.notes }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            notes=""
          else
            version="$(tr -d '\r\n' < VERSION.txt)"
            notes="Automatic build from ${GITHUB_SHA:0:12}"
          fi
          if [ -z "$version" ]; then
            echo 'VERSION.txt is empty.' >&2
            exit 1
          fi
          build_id="${GITHUB_SHA:0:12}-${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          printf '%s' "$notes" > release-notes.txt

      - name: Create update manifest
        run: |
          python tools/build_xianyu_release_manifest.py \
            --version "${{ steps.release.outputs.version }}" \
            --build-id "${{ steps.release.outputs.build_id }}" \
            --registry "${{ env.IMAGE_REGISTRY }}" \
            --namespace "${{ env.IMAGE_NAMESPACE }}" \
            --tag "${{ steps.release.outputs.version }}" \
            --notes "$(cat release-notes.txt)" \
            --output release/latest.json

      - name: Upload manifest to Tencent server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TENCENT_UPDATE_SSH_HOST }}
          username: ${{ secrets.TENCENT_UPDATE_SSH_USER }}
          key: ${{ secrets.TENCENT_UPDATE_SSH_KEY }}
          source: release/latest.json
          target: ${{ secrets.TENCENT_UPDATE_REMOTE_PATH }}
          strip_components: 1
